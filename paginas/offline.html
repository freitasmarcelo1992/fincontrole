<body><main class="box"><div class="icon">&#8645;</div><h1>Você está sem conexão</h1><p>Seus dados financeiros não são armazenados nesta tela por segurança. Reconecte-se para continuar.</p><button type="button" onclick="location.reload()">Tentar novamente</button></main></body>
